[package]
name = "freeprompter"
version = "2.1.0"
description = "自由提词 FreePrompter - 多屏提词器"
license = "GPL-3.0-only"
repository = "https://github.com/CommonerOfWestWall/luke-teleprompter-windows"
edition = "2021"
rust-version = "1.90"

[lib]
name = "freeprompter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
